<aside class="rail" id="rail">
  <a class="rail-portrait" href="{{ '/' | relative_url }}" aria-label="Cypher Rants home">{% include doodle.html who="stephen" size=150 %}</a>
  <a class="wordmark" href="{{ '/' | relative_url }}"><span class="cr">cr.</span><span>cypher rants</span></a>
  <p class="intro">notes on building things, lessons learned, and the occasional rant. by <a href="{{ '/about/' | relative_url }}">Stephen Akinyemi</a>.</p>
  <button class="menu" id="menu-toggle" type="button" aria-expanded="false" aria-controls="rail-nav">menu</button>
  <nav class="rnav" id="rail-nav" aria-label="Main navigation">
    {%- assign here = page.url -%}
    <a href="{{ '/' | relative_url }}" {% if here == '/' or page.layout == 'post' %}class="on" aria-current="page"{% endif %}><span class="arr" aria-hidden="true"><svg viewBox="0 0 22 10"><path d="M1 5c6-1 12-1 18 0M14 1l5 4-5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>writing</a>
    <a href="{{ '/about/' | relative_url }}" {% if here == '/about/' %}class="on" aria-current="page"{% endif %}><span class="arr" aria-hidden="true"><svg viewBox="0 0 22 10"><path d="M1 5c6-1 12-1 18 0M14 1l5 4-5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>about</a>
    <a href="{{ '/cast/' | relative_url }}" {% if here == '/cast/' %}class="on" aria-current="page"{% endif %}><span class="arr" aria-hidden="true"><svg viewBox="0 0 22 10"><path d="M1 5c6-1 12-1 18 0M14 1l5 4-5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>cast</a>
  </nav>
  <button class="tog" id="theme-toggle" type="button" aria-label="Switch to light theme" hidden><span class="tog-icon" aria-hidden="true"></span><span class="tog-label">dark</span></button>
  <div class="rail-foot">
    <div class="socials"><a href="https://github.com/appcypher">github ↗</a><a href="https://x.com/theappcypher">x ↗</a></div>
    <span>© {{ 'now' | date: '%Y' }} cypher rants</span>
  </div>
</aside>
