{%- assign n = include.limit | default: 6 -%}
<section class="cast-section">
  <div class="rule"><span><span class="mark">the cast</span></span><span class="muted">who shows up in the doodles</span></div>
  <div class="cast">
    {%- for c in site.data.cast.cast limit: n %}
    <a class="castchip" href="{{ '/cast/' | relative_url }}#cast-{{ c.name }}">{% include doodle.html who=c.name size=96 %}<span class="who">{{ c.name }}</span></a>
    {%- endfor %}
    <a class="hand castmore" href="{{ '/cast/' | relative_url }}">← the whole cast</a>
  </div>
</section>
