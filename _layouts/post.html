---
layout: default
---
<article class="article">
  <a class="back" href="{{ '/' | relative_url }}">← All writing</a>
  <header class="article-heading"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %d, %Y' }}</time><h1>{{ page.title | escape }}</h1>{% if page.description %}<p>{{ page.description | escape }}</p>{% endif %}</header>
  <div class="prose">{{ content }}</div>
</article>
