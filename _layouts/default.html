<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <div class="shell">
    <header class="header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Cypher Rants home"><span class="mark" aria-hidden="true">cr.</span><span>Cypher Rants</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
        <button id="theme-toggle" type="button" aria-label="Switch to light theme" hidden>Light</button>
      </nav>
    </header>
    <main id="content">{{ content }}</main>
    <footer><span>© {{ 'now' | date: '%Y' }} Cypher Rants</span><a href="https://github.com/appcypher">GitHub ↗</a></footer>
  </div>
</body>
</html>
