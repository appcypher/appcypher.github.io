<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#d2c79d">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {%- assign og_img = page.image | default: site.og_image -%}
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  {%- if og_img %}
  <meta property="og:image" content="{{ og_img | absolute_url }}">
  <meta property="og:image:alt" content="{{ page.image_alt | default: page.description | default: site.description | escape }}">
  {%- endif %}
  {%- if page.layout == 'post' %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <meta property="article:author" content="{{ site.title | escape }}">
  {%- endif %}
  <meta name="twitter:card" content="{% if og_img %}summary_large_image{% else %}summary{% endif %}">
  {%- if site.twitter %}
  <meta name="twitter:creator" content="@{{ site.twitter }}">
  {%- endif %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/assets/favicon.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script>try{if(localStorage.getItem('cypher-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
  <script src="{{ '/assets/theme.js' | relative_url }}" defer></script>
</head>
<body data-glyphs="{{ '/assets/doodles/glyphs.svg' | relative_url }}">
  <svg class="pen-defs" width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true" focusable="false"><filter id="rough" x="-6%" y="-16%" width="112%" height="132%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="7" result="n"></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></svg>
  <a class="skip" href="#content">Skip to content</a>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="boil" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="n"><animate attributeName="seed" values="1;2;3;4" dur="1.4s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  <div class="shell">
    {% include rail.html %}
    <main class="main" id="content">{{ content }}</main>
  </div>
</body>
</html>
