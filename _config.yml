title: Cypher Rants
description: Notes on building things, lessons learned, and the occasional rant. By Stephen Akinyemi (appcypher).
url: https://appcypher.github.io
baseurl: ""
author: appcypher
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: /posts/:title/
timezone: Africa/Lagos
exclude: [Gemfile, Gemfile.lock, README.md, DESIGN.md, tools, vendor, preview, .bundle]
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
